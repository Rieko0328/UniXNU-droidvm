name: Build DroidVM iPadOS 27

on:
  workflow_dispatch:
  push:
    branches: [wip/hackintosh]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout UniXNU (droidvm branch)
        uses: actions/checkout@v4
        with:
          repository: Rieko0328/UniXNU
          ref: wip/droidvm
          path: UniXNU

      - name: Checkout UniXNU-droidvm (hackintosh branch)
        uses: actions/checkout@v4
        with:
          repository: Rieko0328/UniXNU-droidvm
          ref: wip/hackintosh
          path: UniXNU-droidvm

      - name: Show Xcode and disk
        run: |
          ls -1 /Applications | grep -i Xcode || true
          xcodebuild -version || true
          df -h /
          sw_vers

      - name: Select Xcode 27 (if present)
        run: |
          if [ -d /Applications/Xcode_27.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          elif [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          else
            echo "No Xcode 27 found; continuing with default Xcode"
          fi
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew install cmake ninja dtc rustup llvm blacktop/tap/ipsw || true
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios || true
          python3 --version
          rustc --version || true

      - name: Assemble iPadOS 27 board overlay
        run: |
          set -e
          DEV=UniXNU-droidvm
          TMP=$(mktemp -d)
          mkdir -p "$TMP/generic" "$TMP/board"
          git -C "$DEV" archive HEAD scripts | tar -x -C "$TMP/generic" --strip-components=1
          git -C "$DEV" archive HEAD ipados27/scripts | tar -x -C "$TMP/board" --strip-components=2
          tar -C "$TMP/generic" -cf - . | tar -C "$DEV/ipados27/scripts" -xf -
          tar -C "$TMP/board" -cf - . | tar -C "$DEV/ipados27/scripts" -xf -
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UniXNU-droidvm/ipados27/board.toml')
          text = p.read_text()
          if not any(line.strip() == '[ipsw]' for line in text.splitlines()):
              text += '\n[ipsw]\n'
              text += 'url = "https://updates.cdn-apple.com/2026FallFCS/6074e110-d48d-40c2-b0e8-b611520941a3/iPad17,1,iPad17,2,iPad17,3,iPad17,4_27.0.1_24A446_Restore.ipsw"\n'
              text += 'product = "iPad17,3"\n'
              text += 'version = "27.0.1"\n'
              text += 'build = "24A446"\n'
              text += 'device_class = "j820ap"\n'
              text += 'chip_id = 33090\n'
              text += 'board_id = 12\n'
              text += 'fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]\n'
              p.write_text(text)
          print('board ipsw:', p.read_text().split('[ipsw]', 1)[1].splitlines()[1:4])
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UniXNU-droidvm/ipados27/scripts/build-droidvm-all.py')
          s = p.read_text()
          s = s.replace("OS_DMG, SYSTEMOS_DMG = '044-76040-038.dmg', '044-76034-038.dmg'", "OS_DMG, SYSTEMOS_DMG = '043-68950-668.dmg', '043-69086-713.dmg'")
          s = s.replace("OS_IMAGE_SHA256 = 'e5634d04a8ac35f024845f583394e0a35deb26a04cb0c00286a8674e25a9a4f2'", "OS_IMAGE_SHA256 = '8a12cdad43f8f0d33dadcf01a800a560222baf40c05f71374c460ba57ba3a739'")
          p.write_text(s)
          PY
          [ -e "$DEV/ipados27/package" ] || ln -s ../package "$DEV/ipados27/package"
          grep -E '^build =|^version =|^url =' "$DEV/ipados27/board.toml" | head -5

      - name: Prefetch and decrypt IPSW volumes
        working-directory: UniXNU
        env:
          PATH: /Users/runner/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./unixnu -D ../UniXNU-droidvm/ipados27 ipsw fetch OS Cryptex1,SystemOS
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from unixnu import ipsw
          for p in sorted(Path('out/ipsw/24A446').glob('*.dmg.aea')):
              print(ipsw.decrypt_aea(p))
          PY

      - name: Build iPadOS 27 image
        working-directory: UniXNU-droidvm/ipados27
        env:
          PATH: /Users/runner/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build-droidvm-all.py \
            --unixnu ../../UniXNU \
            --unique-chip-id 0123456789abcdef

      - name: Upload release images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-ipados27-release
          path: UniXNU/out/droidvm/release
          if-no-files-found: warn
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-ipados27-logs
          path: |
            UniXNU/out/droidvm/build-all/logs
            UniXNU/out/droidvm/logs
          if-no-files-found: warn
          retention-days: 7
